<script>
'use strict';
/* Utilidades
   Selector, escape HTML (anti-XSS), formato de dinero, avisos (toast), enlaces a Google Maps y lectura/redimensión de imágenes. */
const $ = (s) => document.querySelector(s);
const E = (s) =>
  String(s ?? '').replace(
    /[&<>"']/g,
    (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
  );
const money = (n) => 'S/ ' + Number(n).toFixed(2);
function toast(m) {
  const t = $('#ts');
  t.textContent = m;
  t.className = 'on';
  clearTimeout(toast.t);
  toast.t = setTimeout(() => (t.className = ''), 3500);
}
const maps = (t) => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(t);
function readImg(f, cb, mx = 640) {
  if (!/^image\/(png|jpe?g|webp)$/.test(f.type) || f.size > 4e6)
    return toast('Usa una imagen PNG, JPG o WEBP de hasta 4 MB');
  const r = new FileReader();
  r.onload = () => {
    const i = new Image();
    i.onload = () => {
      const s = Math.min(1, mx / Math.max(i.width, i.height)),
        c = document.createElement('canvas');
      c.width = i.width * s;
      c.height = i.height * s;
      c.getContext('2d').drawImage(i, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', 0.8));
    };
    i.onerror = () => toast('Imagen dañada');
    i.src = r.result;
  };
  r.readAsDataURL(f);
}
</script>

<script>
'use strict';
/* Autenticación
   Hash de contraseñas, sesión del administrador (15 min), login administrador/cliente, registro y cierre de sesión. */
const sha = async (s) =>
  [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('yz$' + s)))]
    .map((b) => b.toString(16).padStart(2, '0'))
    .join('');
try {
  sess = JSON.parse(sessionStorage.getItem('yz_ss'));
} catch {}
const isA = () => {
  if (sess && sess.exp > Date.now()) {
    sess.exp = Date.now() + 9e5;
    try {
      sessionStorage.setItem('yz_ss', JSON.stringify(sess));
    } catch {}
    return true;
  }
  sess = null;
  return false;
};
async function login(u, p) {
  if (Date.now() < lock)
    return toast(`Acceso bloqueado. Espera ${Math.ceil((lock - Date.now()) / 1000)} s`);
  let h;
  try {
    h = await sha(p);
  } catch {
    return toast('Se requiere conexión segura (HTTPS)');
  }
  u = u.trim().toLowerCase();
  const h2 = await sha(u + '|' + p);
  if (role === 'adm' && u === S.auth.u && h === S.auth.h) {
    fails = 0;
    setCu(null);
    sess = { exp: Date.now() + 9e5 };
    isA();
    go('admin');
  } else if (role === 'cli' && S.users.some((x) => x.email === u && x.h === h2)) {
    fails = 0;
    sess = null;
    try {
      sessionStorage.removeItem('yz_ss');
    } catch {}
    setCu(u);
    go(cart.length ? 'cart' : 'menu');
  } else {
    fails++;
    if (fails >= 3) {
      lock = Date.now() + 3e4 * fails;
      toast('Demasiados intentos. Acceso bloqueado temporalmente.');
    } else toast('Correo o contraseña incorrectos');
  }
}
const setCu = (u) => {
  cu = u;
  try {
    u ? localStorage.setItem('yz_cu', JSON.stringify(u)) : localStorage.removeItem('yz_cu');
  } catch {}
};
async function reg() {
  if (Date.now() < lock) return toast('Acceso bloqueado temporalmente');
  const n = $('#rn').value.trim(),
    p = $('#rp').value.trim(),
    u = $('#lu').value.trim().toLowerCase(),
    w = $('#lp').value;
  if (n.length < 2) return toast('Ingresa tu nombre');
  if (!/^9\d{8}$/.test(p)) return toast('El celular debe tener 9 dígitos y empezar con 9');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(u)) return toast('Correo no válido');
  if (w.length < 8 || !/\d/.test(w) || !/[A-Za-z]/.test(w))
    return toast('Usa mínimo 8 caracteres con letras y números');
  let h;
  try {
    h = await sha(u + '|' + w);
  } catch {
    return toast('Se requiere conexión segura (HTTPS)');
  }
  let ok = 1;
  mut(() => {
    if (u === S.auth.u || S.users.some((x) => x.email === u)) ok = 0;
    else S.users.push({ email: u, name: n, phone: p, h });
  });
  if (!ok) return toast('Ese correo ya está registrado');
  setCu(u);
  go(cart.length ? 'cart' : 'menu');
  toast('Cuenta creada');
}
</script>

<script>
'use strict';
/* Cola de cocina (cuello de botella)
   Capacidad limitada: los pedidos esperan turno, entran solos a preparación y se calcula el tiempo estimado. */
/* Cola de cocina: capacidad limitada => los pedidos esperan su turno */
const queue = () => S.orders.filter((o) => o.status < 2).sort((a, b) => a.t - b.t);
function tick() {
  let ch = 0;
  queue().forEach((o, i) => {
    if (o.status === 0 && i < CAP) {
      o.status = 1;
      note(o.email, `Tu pedido ${o.id} entró a preparación 👨‍🍳`);
      ch = 1;
    }
  });
  if (ch) sv();
}
function qinfo(o) {
  const q = queue(),
    i = q.findIndex((x) => x.id === o.id);
  if (i < 0) return '';
  const r = Math.floor(i / CAP);
  return i < CAP
    ? `Tu pedido está en cocina. Estará listo en unos ${PREP} min.`
    : `Hay ${i} pedido(s) antes que el tuyo. Entrará a preparación en ~${r * PREP} min y estará listo en ~${(r + 1) * PREP} min.`;
}
const banner = () => {
  const n = queue().length;
  return n >= CAP
    ? `<div class="bn">🔥 Alta demanda: ${n} pedidos en cola. Espera estimada ~${Math.ceil(n / CAP) * PREP} min.</div>`
    : '';
};
</script>

          `<div class="ord"><div><b>${E(o.id)}</b> · ${E(o.name)} · ${E(o.phone)}<br><span class="mu">${o.items.map((i) => `${i.q}× ${E(i.name)}`).join(', ')} — ${money(o.total)} · ${E(o.type)}${o.type === 'Delivery' ? ' · ' + E(o.addr || 'Ubicación GPS') + ` <a href="${E(maps(o.geo || o.addr))}" target="_blank" rel="noopener">Ver en Google Maps</a>` : ''}</span></div><div class="bt"><span class="tag s${o.status}">${STAT[o.status]}</span>${o.status < 4 ? `<button class="btn s" data-a="adv" data-id="${o.id}">Pasar a ${STAT[o.status + 1]}</button>` : ''}<a class="btn s" target="_blank" rel="noopener" href="https://wa.me/51${E(o.phone)}?text=${encodeURIComponent('Hola ' + o.name + ', tu pedido ' + o.id + ' está: ' + STAT[o.status])}">WhatsApp</a></div></div>`,
      )
      .join('') || '<p class="mu">Aún no hay pedidos.</p>'
  }</div>`;
</script>
<script>
'use strict';
/* Admin: platos y promociones
   Edición de nombre, precio, categoría, visibilidad y foto de platos y promociones. */
function aEd(k) {
  return `<div class="panel"><button class="btn" data-a="new" data-k="${k}">Agregar ${k === 'menu' ? 'plato' : 'promoción'}</button>${S[k].map((x) => `<div class="row" data-id="${x.id}" data-k="${k}"><div class="ph sm">${thumb(x)}</div><div class="f"><input class="n" value="${E(x.name)}" maxlength="40" aria-label="Nombre"><input class="p" type="number" min="0" max="999" step="0.5" value="${x.price}" aria-label="Precio">${k === 'menu' ? `<select class="c" aria-label="Categoría">${CATS.map((c) => `<option${c === x.cat ? ' selected' : ''}>${c}</option>`).join('')}</select>` : `<input class="c" value="${E(x.desc)}" maxlength="80" aria-label="Descripción">`}<label><input type="checkbox" class="ac"${x.on ? ' checked' : ''}> Visible</label></div><div class="bt"><label class="btn s">📷 Subir foto<input type="file" accept="image/png,image/jpeg,image/webp" hidden data-up></label><button class="s" data-a="rmimg">Quitar foto</button><button class="btn s" data-a="save">Guardar</button><button class="s dg" data-a="del">Eliminar</button></div></div>`).join('')}</div>`;
}
function upd(row, img) {
  const k = row.dataset.k,
    n = row.querySelector('.n').value.trim().slice(0, 40),
    p = parseFloat(row.querySelector('.p').value),
    c = row.querySelector('.c').value.trim(),
    on = row.querySelector('.ac').checked;
  if (!n || !(p >= 0 && p <= 999)) {
    toast('Ingresa un nombre y un precio válido');
    return false;
  }
  if (on && p <= 0) {
    toast('Un plato visible necesita un precio mayor a 0');
    return false;
  }
  mut(() => {
    const x = S[k].find((z) => z.id === row.dataset.id);
    if (!x) return;
    x.name = n;
    x.price = Math.round(p * 100) / 100;
    if (k === 'menu') x.cat = CATS.includes(c) ? c : 'Alitas';
    else x.desc = c.slice(0, 80);
    x.on = on ? 1 : 0;
    if (img !== undefined) x.img = img;
  });
  return true;
}
</script>
<script>
'use strict';
/* Admin: reportes
   Ventas por hora, platos más vendidos, indicadores y datos de ejemplo. */
function aRep() {
  const os = S.orders;
  if (!os.length)
    return `<div class="panel"><p class="mu">Aún no hay ventas. Carga datos de ejemplo para ver cómo se ven los reportes.</p><button class="btn" data-a="demo">Cargar datos de ejemplo</button></div>`;
  const hr = Array(24).fill(0),
    tp = {};
  let tot = 0;
  os.forEach((o) => {
    hr[new Date(o.t).getHours()]++;
    tot += o.total;
    o.items.forEach((i) => (tp[i.name] = (tp[i.name] || 0) + i.q));
  });
  const mx = Math.max(...hr),
    top = Object.entries(tp)
      .sort((a, b) => b[1] - a[1])
      .slice(0, 5),
    tm = top[0][1];
  return `<div class="kpis"><div><b>${money(tot)}</b>Ventas totales</div><div><b>${os.length}</b>Pedidos</div><div><b>${money(tot / os.length)}</b>Ticket promedio</div><div><b>${hr.indexOf(mx)}:00</b>Hora pico</div></div>
<div class="panel"><h3>Pedidos por hora</h3><div class="bars">${hr.map((v, h) => (h >= 10 ? `<div><i style="height:${(v / mx) * 100}%" title="${v} pedidos"></i><small>${h}</small></div>` : '')).join('')}</div></div>
<div class="panel"><h3>Platos más vendidos</h3>${top.map(([n, q]) => `<div class="tp"><span>${E(n)}</span><u style="width:${(q / tm) * 60}%"></u><b>${q}</b></div>`).join('')}</div>
<div class="panel"><button class="s dg" data-a="clr">Borrar historial</button></div>`;
}
function demo() {
  mut(() => {
    const H = [12, 13, 15, 17, 18, 19, 19, 20, 20, 20, 21, 21, 22];
    for (let i = 0; i < 80; i++) {
      const d = new Date();
      d.setDate(d.getDate() - Math.floor(Math.random() * 7));
      d.setHours(H[Math.floor(Math.random() * H.length)], Math.floor(Math.random() * 60));
      const its = [...S.menu]
        .sort(() => Math.random() - 0.5)
        .slice(0, 1 + Math.floor(Math.random() * 3))
        .map((x) => ({ name: x.name, q: 1 + Math.floor(Math.random() * 2), price: x.price }));
      S.orders.push({
        id: 'DEMO-' + i,
        name: 'Demo',
        phone: '900000000',
        addr: '',
        type: 'Delivery',
        items: its,
        total: its.reduce((s, x) => s + x.q * x.price, 0),
        status: 4,
        t: +d,
      });
    }
  });
  render();
}
</script>
<script>
'use strict';
/* Admin: cuenta y negocio
   Cambio de contraseña, WhatsApp, dirección del local y foto de portada. */
const aCta = () =>
  `<div class="panel fm narrow"><h3>Cambiar contraseña</h3><input id="pc" type="password" placeholder="Contraseña actual" autocomplete="current-password"><input id="pn" type="password" placeholder="Nueva (mín. 8, letras y números)" autocomplete="new-password"><button class="btn" data-a="pw">Guardar contraseña</button></div><div class="panel fm narrow"><h3>Datos del negocio</h3><input id="bw" placeholder="WhatsApp (ej. 51999999999)" value="${E(S.wa)}" maxlength="15" inputmode="numeric"><input id="bl" placeholder="Dirección del local" value="${E(S.loc)}" maxlength="90"><button class="btn" data-a="biz">Guardar datos</button><label class="btn s">Subir foto de portada<input type="file" accept="image/png,image/jpeg,image/webp" hidden data-hero></label><button class="s" data-a="rmhero">Quitar portada</button></div>`;
async function pw() {
  const c = $('#pc').value,
    n = $('#pn').value;
  if ((await sha(c)) !== S.auth.h) return toast('La contraseña actual no coincide');
  if (n.length < 8 || !/\d/.test(n) || !/[A-Za-z]/.test(n))
    return toast('Usa mínimo 8 caracteres con letras y números');
  const h = await sha(n);
  mut(() => {
    S.auth.h = h;
  });
  $('#pc').value = $('#pn').value = '';
  toast('Contraseña actualizada');
}
</script>
<script>
'use strict';
/* Navegación y render
   Cambio de vista, ciclo de renderizado y refresco automático sin borrar lo que el usuario escribe. */
/* Pestañas de edición del admin: no se redibujan solas */
const editing = () => view === 'admin' && ['menu', 'promos', 'cta'].includes(at);
const go = (v) => {
  view = v;
  render();
  scrollTo(0, 0);
};
function render() {
  S = load();
  tick();
  nav();
  alerts();
  $('#m').className = view === 'home' ? 'wide' : '';
  $('#m').innerHTML = {
    home: vHome,
    menu: vMenu,
    promos: vPromos,
    cart: vCart,
    admin: vAdmin,
    auth: vAuth,
    about: vAbout,
  }[view]();
}
/* Cada 5 s: en el carrito solo se actualiza "Mis pedidos" (el formulario no se toca) */
function refresh() {
  S = load();
  tick();
  nav();
  alerts();
  if (view === 'cart') {
    const mo = $('#mo');
    if (mo) mo.innerHTML = ordersHtml();
    return;
  }
  if (!/INPUT|SELECT/.test(document.activeElement.tagName) && !editing()) render();
}
</script>
<script>
'use strict';
/* Eventos
   Controlador: clics, cambios, búsqueda, teclado y sincronización entre pestañas. Acciones de admin protegidas. */
const ADM = [
  'adv',
  'new',
  'save',
  'del',
  'rmimg',
  'at',
  'logout',
  'demo',
  'clr',
  'pw',
  'biz',
  'rmhero',
];
document.addEventListener('click', async (e) => {
  if (!e.target.closest('#np') && !e.target.closest('[data-a=bell]')) $('#np').hidden = true;
  const b = e.target.closest('[data-a]');
  if (!b) return;
  const a = b.dataset.a,
    v = b.dataset.v,
    id = b.dataset.id,
    row = b.closest('.row');
  if (ADM.includes(a) && !isA()) return go('admin');
  if ((a === 'del' || a === 'clr') && !b.dataset.c) {
    b.dataset.c = 1;
    b.textContent = '¿Seguro? Confirmar';
    return;
  }
  switch (a) {
    case 'go':
      $('#np').hidden = true;
      go(v);
      break;
    case 'cat':
      cat = v;
      render();
      break;
    case 'add': {
      const c = cart.find((i) => i.id === id);
      c ? (c.q = Math.min(c.q + 1, 20)) : cart.push({ id, q: 1 });
      nav();
      toast('Agregado al carrito');
      break;
    }
    case 'q': {
      const c = cart.find((i) => i.id === id);
      if (c) {
        c.q = Math.min(20, c.q + +b.dataset.d);
        if (c.q < 1) cart = cart.filter((i) => i !== c);
      }
      render();
      break;
    }
    case 'order':
      order();
      break;
    case 'login':
      login($('#lu').value, $('#lp').value);
      break;
    case 'logout':
      sess = null;
      try {
        sessionStorage.removeItem('yz_ss');
      } catch {}
      go('admin');
      break;
    case 'at':
      at = v;
      render();
      break;
    case 'adv':
      mut(() => {
        const o = S.orders.find((x) => x.id === id);
        if (o && o.status < 4) {
          o.status++;
          note(o.email, `Tu pedido ${o.id}: ${STAT[o.status]}`);
        }
        tick();
      });
      render();
      break;
    case 'new': {
      const k = b.dataset.k;
      mut(() =>
        S[k].unshift({
          id: (k === 'menu' ? 'm' : 'p') + Date.now(),
          name: 'Nuevo',
          price: 0,
          cat: 'Alitas',
          desc: '',
          emoji: '🍗',
          img: '',
          on: 0,
        }),
      );
      render();
      toast(
        'Borrador creado: escribe nombre y precio, sube la foto, marca Visible y pulsa Guardar.',
      );
      $('.row .n')?.select();
      break;
    }
    case 'save':
      if (upd(row)) {
        render();
        toast(
          row.querySelector('.ac').checked
            ? 'Cambios guardados'
            : 'Guardado, pero sigue oculto para los clientes: marca Visible',
        );
      }
      break;
    case 'del':
      mut(() => {
        S[row.dataset.k] = S[row.dataset.k].filter((x) => x.id !== row.dataset.id);
      });
      cart = cart.filter((i) => i.id !== row.dataset.id);
      render();
      break;
    case 'rmimg':
      mut(() => {
        const x = S[row.dataset.k].find((z) => z.id === row.dataset.id);
        if (x) x.img = '';
      });
      render();
      toast('Foto eliminada');
      break;
    case 'demo':
      demo();
      break;
    case 'clr':
      mut(() => {
        S.orders = [];
        S.notes = [];
      });
      render();
      break;
    case 'pw':
      pw();
      break;
    case 'biz': {
      const w = $('#bw').value.replace(/\D/g, ''),
        l = $('#bl').value.trim().slice(0, 90);
      if (w && !/^\d{10,13}$/.test(w)) return toast('Número de WhatsApp no válido');
      mut(() => {
        S.wa = w;
        S.loc = l || S.loc;
      });
      nav();
      toast('Datos guardados');
      break;
    }
    case 'am':
      am = v;
      render();
      break;
    case 'reg':
      reg();
      break;
    case 'cout':
      setCu(null);
      cart = [];
      go('home');
      break;
    case 'auth':
      role = b.dataset.r === 'adm' ? 'adm' : 'cli';
      am = 'in';
      go('auth');
      break;
    case 'start':
      if (!cart.length) toast('Elige tus platos y pulsa Agregar');
      go(cart.length ? 'cart' : 'menu');
      break;
    case 'rmhero':
      mut(() => {
        S.hero = '';
      });
      toast('Portada eliminada');
      break;
    case 'geo': {
      if (!navigator.geolocation) return toast('Tu navegador no permite obtener la ubicación');
      navigator.geolocation.getCurrentPosition(
        (p) => {
          geo = p.coords.latitude.toFixed(6) + ',' + p.coords.longitude.toFixed(6);
          $('#gi').textContent = 'Ubicación GPS adjunta. El repartidor la verá en Google Maps.';
        },
        () => toast('No se pudo obtener la ubicación. Escribe tu dirección.'),
        { timeout: 8000 },
      );
      break;
    }
    case 'bell': {
      const p = $('#np');
      if (!p.hidden) {
        p.hidden = true;
        break;
      }
      const L = myNotes();
      p.innerHTML = bellHtml();
      p.hidden = false;
      mut(() =>
        L.forEach((n) => {
          const y = S.notes.find((z) => z.id === n.id);
          if (y) y.r = 1;
        }),
      );
      lu = 0;
      nav();
      break;
    }
    case 'ndel':
      dropNotes([id]);
      $('#np').innerHTML = bellHtml();
      nav();
      break;
    case 'nclr':
      dropNotes(myNotes().map((n) => n.id));
      $('#np').innerHTML = bellHtml();
      nav();
      break;
  }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.name === 'ty') {
    $('#dv').hidden = t.value !== 'Delivery';
    $('#rc').hidden = t.value === 'Delivery';
    return;
  }
  if (t.matches('[data-hero]')) {
    if (!isA()) return go('admin');
    const f = t.files[0];
    if (f)
      readImg(
        f,
        (url) => {
          mut(() => {
            S.hero = url;
          });
          toast('Portada actualizada');
        },
        1400,
      );
    return;
  }
  if (!t.matches('[data-up]')) return;
  if (!isA()) return go('admin');
  const f = t.files[0],
    row = t.closest('.row');
  if (f)
    readImg(f, (url) => {
      if (upd(row, url)) {
        render();
        toast('Foto actualizada');
      }
    });
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'lp') $('[data-a=login],[data-a=reg]')?.click();
});
window.addEventListener('storage', refresh);
document.addEventListener('input', (e) => {
  if (e.target.id === 'sq') {
    q = e.target.value.trim().toLowerCase().slice(0, 30);
    $('#gr').innerHTML = mGrid();
  }
});
</script>
<script>
'use strict';
/* Arranque
   Inicialización, migración de datos y refresco automático cada 5 s. */
(async () => {
  S = ld('s', null) || seed();
  cu = ld('cu', null);
  if (S.v !== 3) {
    const d = seed();
    Object.assign(S, {
      menu: d.menu,
      promos: d.promos,
      users: S.users || [],
      wa: S.wa || '',
      loc: d.loc,
      v: 3,
    });
    sv();
  }
  /* Limpieza: avisos antiguos que no pertenecían a una cuenta concreta */
  S.notes = (S.notes || []).filter((n) => n.to === 'admin' || String(n.to).includes('@'));
  if (!S.auth) {
    try {
      S.auth = { u: 'admin@yalaza.pe', h: await sha('Yalaza#2026') };
      sv();
    } catch {
      S.auth = { u: '', h: 'x' };
    }
  }
  render();
  setInterval(refresh, 5000);
})();
</script>
